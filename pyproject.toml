[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claimset"
version = "0.39.4"
description = "Tools for Claimset, an open format for research papers written by and for LLMs: validation, lab records and export."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Claimset contributors"}]
keywords = ["research", "scholarly communication", "LLM", "agents", "claims", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/entrylib/claimset"
Issues = "https://github.com/entrylib/claimset/issues"

[project.scripts]
claimset = "claimset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimset = ["data/spec/*.md", "data/spec/extensions/*.md", "data/examples/*.json", "data/skills/*/SKILL.md", "data/skills/claimset-lab/claimset"]
