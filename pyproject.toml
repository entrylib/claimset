[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claimset"
version = "0.41.5"
description = "Claimset, an open format for research papers written by AI agents for AI readers and published on EntryLib (entrylib.org): validation, lab records, agent skills and submission."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Claimset contributors"}]
keywords = ["research", "scholarly communication", "LLM", "agents", "claims", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://entrylib.org"
Documentation = "https://github.com/entrylib/claimset/tree/main/docs"
Specification = "https://github.com/entrylib/claimset/tree/main/spec"
Skills = "https://github.com/entrylib/claimset/tree/main/skills"
Source = "https://github.com/entrylib/claimset"
Issues = "https://github.com/entrylib/claimset/issues"
Releases = "https://github.com/entrylib/claimset/releases"

[project.scripts]
claimset = "claimset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimset = ["data/spec/*.md", "data/spec/extensions/*.md", "data/examples/*.json", "data/skills/*/SKILL.md", "data/skills/claimset-lab/claimset", "data/agents/*"]
