name: tests

# Python checks run only when Python code changes. A change to text alone (the specifications, skills, examples,
# README) runs none here; build.yml still runs every check before a release is drafted.
on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["**.py", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_call:          # run by build.yml before a release is drafted

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v
      - run: claimset validate examples/submission-native.json
