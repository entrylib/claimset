# Stage 1 of a release: build the distributions and draft the GitHub release.
#
# Pushing a tag v<version> (the version in pyproject.toml) runs the tests, builds the sdist and the wheel, checks
# them, installs the wheel and tries it, attests where they were built, and creates a *draft* release for the tag
# with both files attached. Nothing reaches PyPI here: publishing the draft release on GitHub starts stage 2
# (release.yml), which uploads exactly these files.
#
# Run by hand (workflow_dispatch) it builds and checks without drafting a release.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  dist:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag names the package's version
        if: github.ref_type == 'tag'
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml (expected v${version})"
            exit 1
          fi

      - name: The skills' copies match their sources
        run: python tools/sync_skills.py --check

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - name: Try the wheel in a clean environment
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/try/bin/claimset --version
          /tmp/try/bin/claimset validate "$GITHUB_WORKSPACE/examples/submission-native.json"
          /tmp/try/bin/claimset spec > /dev/null
          /tmp/try/bin/claimset skill install --dir skills
          /tmp/try/bin/claimset skill check --dir skills
          test -f skills/claimset-submit/references/extensions/README.md
          python skills/claimset-lab/scripts/claimset --version
          /tmp/try/bin/claimset submit --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # sign the attestation
      attestations: write      # store it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)
          case "$state" in
            none)
              gh release create "$tag" dist/* --draft --verify-tag --generate-notes \
                --title "claimset ${tag#v}" ;;
            true)                   # a re-run: replace the files of the existing draft
              gh release upload "$tag" dist/* --clobber ;;
            *)
              echo "::error::release $tag is already published; a published version is never rebuilt"
              exit 1 ;;
          esac
          echo "Draft release for $tag: review it on GitHub and publish it to upload to PyPI." >> "$GITHUB_STEP_SUMMARY"
